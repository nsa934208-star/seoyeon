<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멜론머그 공식 스토어 | 메론빵 곰돌이 머그컵</title>
<meta name="description" content="메론빵을 닮은 곰돌이 머그컵, 멜론머그 공식 스토어">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFBF3;word-break:keep-all}
a{color:#4A6420}a:hover{color:#33461A}
.gingham{background-color:#FBF1DE;background-image:linear-gradient(90deg,rgba(236,190,110,.22) 50%,transparent 50%),linear-gradient(rgba(236,190,110,.22) 50%,transparent 50%);background-size:32px 32px}
.field{width:100%;box-sizing:border-box;height:48px;border:1.5px solid #E2D3B8;border-radius:12px;padding:0 14px;font:inherit;font-size:15px;color:#3B2410;background:#fff}
.area{width:100%;box-sizing:border-box;min-height:120px;border:1.5px solid #E2D3B8;border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;color:#3B2410;background:#fff;resize:vertical}
.field:focus,.area:focus{outline:3px solid #B9CF8A;border-color:#5E7B2C}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #B9CF8A;outline-offset:2px}
.lift{transition:transform .15s ease,box-shadow .15s ease}
.lift:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(90,56,20,.12)}
.pd{display:grid;grid-template-columns:minmax(0,1fr) 400px;column-gap:56px;grid-template-areas:"gal buy" "det buy"}
.pd-gal{grid-area:gal}.pd-det{grid-area:det}
.pd-buy{grid-area:buy;position:sticky;top:92px;align-self:start}
@media (max-width:980px){.pd{grid-template-columns:minmax(0,1fr);grid-template-areas:"gal" "buy" "det";row-gap:28px}.pd-buy{position:static}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: 'Noto Sans KR', sans-serif; color: #3B2410; background: #FFFBF3; min-height: 100vh; display: flex; flex-direction: column">

<div style="background: #4A6420; color: #FFFBF3; font-size: 14px; padding: 8px 16px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; text-align: center">
<span>앱 설치하면 <b>3,000원 쿠폰</b> · 5만원 이상 무료배송</span>
<button onClick="{{openApp}}" style="background: #FFFBF3; color: #33461A; border: 0; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; min-height: 32px">앱 설치하기</button>
</div>

<header style="position: sticky; top: 0; z-index: 20; background: rgba(255,251,243,.97); border-bottom: 1px solid #EFE2C8">
<div style="max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
<button onClick="{{goHome}}" aria-label="멜론머그 홈" style="display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; min-height: 44px">
<svg width="38" height="36" viewBox="0 0 38 36" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="#D6E0A9" stroke="#5E7B2C" stroke-width="2"></circle><circle cx="29" cy="9" r="6" fill="#D6E0A9" stroke="#5E7B2C" stroke-width="2"></circle><circle cx="19" cy="20" r="14" fill="#D6E0A9" stroke="#5E7B2C" stroke-width="2"></circle><circle cx="14" cy="19" r="1.8" fill="#3B2410"></circle><circle cx="24" cy="19" r="1.8" fill="#3B2410"></circle><ellipse cx="19" cy="23.5" rx="2.2" ry="1.6" fill="#3B2410"></ellipse></svg>
<span style="font-family: 'DM Serif Display', serif; font-size: 28px; color: #5A3814">melon mug</span>
</button>
<nav aria-label="주 메뉴" style="display: flex; gap: 2px; flex-wrap: wrap; flex: 1 1 360px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<button onClick="{{n.go}}" aria-current="{{n.cur}}" style="{{n.style}}">{{n.label}}</button>
</sc-for>
</nav>
<button onClick="{{goCart}}" aria-label="장바구니" style="display: flex; align-items: center; gap: 8px; background: #5E7B2C; color: #fff; border: 0; border-radius: 999px; padding: 0 16px; height: 44px; font-size: 14px; font-weight: 700">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
장바구니 {{cartCount}}
</button>
</div>
</header>

<main style="flex: 1">

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<section class="gingham" style="padding: 64px 20px 72px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<span style="align-self: flex-start; background: #fff; border: 1.5px solid #5E7B2C; color: #4A6420; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700">melon mug · 빵을 닮은 테이블웨어</span>
<h1 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 54px; line-height: 1.18; color: #5A3814">먹고 싶은 빵을<br>이제, 머그컵으로!</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #5C4126; max-width: 500px">멜론머그는 좋아하는 빵을 매일 곁에 두고 싶은 마음에서 시작했어요. 바삭한 메론빵의 격자무늬와 곰돌이 얼굴을 담은 세라믹 머그로, 평범한 아침 커피를 작은 행복으로 바꿔요.</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<button onClick="{{goProduct}}" style="background: #5E7B2C; color: #fff; border: 0; border-radius: 14px; padding: 0 26px; height: 54px; font-weight: 700; font-size: 17px">상품 보러가기</button>
<button onClick="{{goBrand}}" style="background: #fff; color: #5A3814; border: 1.5px solid #D9C29A; border-radius: 14px; padding: 0 22px; height: 54px; font-weight: 700; font-size: 17px">브랜드 이야기</button>
</div>
</div>
<div style="flex: 1 1 420px; min-width: 0">
<img src="images/mug-lid.jpg" alt="곰돌이 뚜껑이 달린 연두색 메론빵 머그컵" style="width: 100%; aspect-ratio: 620 / 573; object-fit: cover; border-radius: 28px; border: 6px solid #fff; box-shadow: 0 18px 40px rgba(90,56,20,.16); display: block">
</div>
</div>
</section>

<section style="padding: 72px 20px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; letter-spacing: .2em; font-weight: 700; color: #A23A16">NEW ARRIVALS</span><h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 34px; color: #5A3814">신상품</h2></div>
<button onClick="{{goProduct}}" style="background: none; border: 0; color: #4A6420; font-weight: 700; font-size: 15px; min-height: 44px">전체 보기 →</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<sc-for list="{{newCards}}" as="c" hint-placeholder-count="2">
<button onClick="{{c.go}}" class="lift" style="text-align: left; background: #fff; border: 1.5px solid #EFE2C8; border-radius: 22px; padding: 0; overflow: hidden; display: flex; flex-direction: column; color: #3B2410">
<span style="position: relative; display: block">
<img src="{{c.img}}" alt="{{c.title}}" style="width: 100%; aspect-ratio: 620 / 573; object-fit: cover; display: block">
<span style="position: absolute; top: 14px; left: 14px; background: #A23A16; color: #fff; border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700">{{c.badge}}</span>
</span>
<span style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 17px; font-weight: 700">{{c.title}}</span>
<span style="font-size: 14px; color: #5C4126">{{c.desc}}</span>
<span style="font-size: 18px; font-weight: 700; color: #5A3814">{{c.priceText}}</span>
<span style="font-size: 14px; font-weight: 700; color: #4A6420">상세 보기 →</span>
</span>
</button>
</sc-for>
</div>
</div>
</section>

<section style="padding: 48px 20px 72px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; letter-spacing: .2em; font-weight: 700; color: #4A6420">BEST</span><h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 34px; color: #5A3814">인기 상품</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<sc-for list="{{bestCards}}" as="c" hint-placeholder-count="2">
<button onClick="{{c.go}}" class="lift" style="text-align: left; background: #fff; border: 1.5px solid #EFE2C8; border-radius: 22px; padding: 0; overflow: hidden; display: flex; flex-direction: column; color: #3B2410">
<span style="position: relative; display: block">
<img src="{{c.img}}" alt="{{c.title}}" style="width: 100%; aspect-ratio: 620 / 573; object-fit: cover; display: block">
<span style="position: absolute; top: 14px; left: 14px; background: #4A6420; color: #fff; border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700">{{c.badge}}</span>
</span>
<span style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 17px; font-weight: 700">{{c.title}}</span>
<span style="font-size: 14px; color: #5C4126">{{c.desc}}</span>
<span style="font-size: 18px; font-weight: 700; color: #5A3814">{{c.priceText}}</span>
<span style="font-size: 14px; font-weight: 700; color: #4A6420">상세 보기 →</span>
</span>
</button>
</sc-for>
</div>
</div>
</section>

<section style="padding: 0 20px 72px">
<div style="max-width: 1200px; margin: 0 auto; background: #fff; border: 1.5px solid #EFE2C8; border-radius: 26px; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap"><h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 30px; color: #5A3814">구매 후기</h2><span style="font-size: 16px"><b style="color: #C27A12">★ {{avgText}}</b> · 후기 {{reviewCount}}개</span></div>
<button onClick="{{goReview}}" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #D9C29A; background: #fff; color: #5A3814; font-weight: 700; font-size: 14px">리뷰 전체 보기</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px">
<sc-for list="{{reviewPreview}}" as="r" hint-placeholder-count="3">
<button onClick="{{goReview}}" style="text-align: left; background: #FFFBF3; border: 1.5px solid #EFE2C8; border-radius: 18px; padding: 14px; display: flex; gap: 12px; color: #3B2410">
<img src="{{r.img}}" alt="" aria-hidden="true" style="width: 72px; height: 72px; flex: 0 0 auto; border-radius: 12px; object-fit: cover; background: #F4EAD6">
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><b style="color: #C27A12; font-size: 14px">{{r.stars}}</b><span style="font-size: 14px; line-height: 1.5; color: #5C4126">{{r.short}}</span></span>
</button>
</sc-for>
</div>
</div>
</section>

<section id="play" class="gingham" style="padding: 72px 20px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; letter-spacing: .2em; font-weight: 700; color: #4A6420">EVENT</span><h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 34px; color: #5A3814">놀러 와서 쿠폰 받아 가세요</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 1 1 520px; min-width: 0; background: #fff; border-radius: 26px; padding: 30px; border: 1.5px solid #EFE2C8; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h3 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 28px; color: #5A3814">나와 닮은 빵 찾기</h3>
<span style="background: #EAF1DA; color: #33461A; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700">결과 보면 3,000원 쿠폰</span>
</div>
<sc-if value="{{quizRunning}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 14px; color: #6B5232">질문 {{quizStep}} / 3</div>
<div style="height: 8px; border-radius: 999px; background: #F4EAD6; overflow: hidden"><div style="{{quizBar}}"></div></div>
<p style="margin: 0; font-size: 21px; font-weight: 700">{{quizQ}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{quizOpts}}" as="o" hint-placeholder-count="2">
<button onClick="{{o.pick}}" class="lift" style="min-height: 60px; text-align: left; padding: 14px 18px; border-radius: 16px; border: 1.5px solid #D9C29A; background: #FFFBF3; font-size: 16px; color: #3B2410">{{o.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{quizDone}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; color: #6B5232">당신은…</span>
<p style="margin: 0; font-family: 'Jua', sans-serif; font-size: 36px; color: #4A6420">{{result.name}}</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7">{{result.desc}}</p>
<div style="background: #FBF1DE; border: 2px dashed #C9A86A; border-radius: 16px; padding: 14px 16px; font-size: 15px">쿠폰 <b style="letter-spacing: .06em">BREAD3000</b> · 주문서에서 3,000원 자동 할인</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button onClick="{{shareQuiz}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #5E7B2C; color: #fff; font-weight: 700; font-size: 15px">결과 공유하기</button>
<button onClick="{{resetQuiz}}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1.5px solid #D9C29A; background: #fff; color: #5A3814; font-weight: 700; font-size: 15px">다시 하기</button>
</div>
</div>
</sc-if>
</div>
</div>
</div>
</section>

<section style="padding: 72px 20px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; letter-spacing: .2em; font-weight: 700; color: #4A6420">BUSINESS MODEL</span><h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 34px; color: #5A3814">멜론머그의 수익 구조</h2></div>
<button onClick="{{goBrand}}" style="background: none; border: 0; color: #4A6420; font-weight: 700; font-size: 15px; min-height: 44px">자세히 보기 →</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{flow}}" as="st" hint-placeholder-count="4">
<div style="flex: 1 1 200px; min-width: 0; background: #FBF1DE; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Jua', sans-serif; font-size: 15px; color: #4A6420">STEP {{st.no}}</span><span style="font-weight: 700; font-size: 17px">{{st.title}}</span><span style="font-size: 14px; color: #5C4126; line-height: 1.5">{{st.body}}</span></div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<sc-for list="{{revenue}}" as="r" hint-placeholder-count="4">
<div style="background: #fff; border: 1.5px solid #EFE2C8; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 8px"><span style="align-self: flex-start; background: {{r.tagBg}}; color: {{r.tagFg}}; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700">{{r.tag}}</span><h3 style="margin: 0; font-size: 18px; color: #5A3814">{{r.title}}</h3><p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5C4126">{{r.body}}</p></div>
</sc-for>
</div>
</div>
</section>

<section style="padding: 72px 20px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 1 1 280px; min-width: 0; display: flex; justify-content: center">
<div style="width: 260px; height: 520px; border-radius: 42px; background: #2B1A0B; padding: 12px; box-shadow: 0 24px 50px rgba(59,36,16,.22)">
<div style="width: 100%; height: 100%; border-radius: 32px; background: #FFFBF3; overflow: hidden; display: flex; flex-direction: column; gap: 12px">
<div style="padding: 32px 16px 0; display: flex; justify-content: space-between; align-items: center"><span style="font-family: 'DM Serif Display', serif; font-size: 20px; color: #5A3814">melon mug</span><span style="background: #EAF1DA; color: #33461A; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 700">스탬프 3/5</span></div>
<div style="margin: 0 12px; background: #4A6420; color: #fff; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px">알림</span><span style="font-size: 13px; font-weight: 700">입금이 확인됐어요! 곧 출고돼요</span></div>
<img src="images/mug-lid.jpg" alt="" aria-hidden="true" style="margin: 0 12px; width: calc(100% - 24px); height: 160px; object-fit: cover; border-radius: 16px">
<div style="margin: 0 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><div style="background: #FBF1DE; border-radius: 12px; padding: 10px; font-size: 12px; font-weight: 700; color: #5A3814">앱 전용<br>3,000원 쿠폰</div><div style="background: #FBF1DE; border-radius: 12px; padding: 10px; font-size: 12px; font-weight: 700; color: #5A3814">시즌 컬러<br>먼저 구매</div></div>
</div>
</div>
</div>
<div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 13px; letter-spacing: .2em; font-weight: 700; color: #4A6420">APP</span>
<h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 36px; color: #5A3814">입금 확인부터 빵지순례 기록까지, 앱 하나로</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{appPerks}}" as="p" hint-placeholder-count="4">
<div style="background: #fff; border: 1.5px solid #EFE2C8; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 15px">{{p.title}}</span><span style="font-size: 14px; line-height: 1.5; color: #5C4126">{{p.body}}</span></div>
</sc-for>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button onClick="{{openIos}}" style="height: 54px; padding: 0 22px; border-radius: 14px; border: 0; background: #2B1A0B; color: #fff; font-size: 16px; font-weight: 700">App Store</button>
<button onClick="{{openAndroid}}" style="height: 54px; padding: 0 22px; border-radius: 14px; border: 0; background: #2B1A0B; color: #fff; font-size: 16px; font-weight: 700">Google Play</button>
</div>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isProduct}}" hint-placeholder-val="{{ false }}">
<section style="padding: 28px 20px 96px; background: #fff">
<div style="max-width: 1200px; margin: 0 auto 18px; font-size: 13px; color: #6B5232; display: flex; gap: 6px; align-items: center"><button onClick="{{goHome}}" style="background: none; border: 0; padding: 8px 0; color: #6B5232; font-size: 13px">홈</button><span aria-hidden="true">›</span><span>머그컵</span><span aria-hidden="true">›</span><span>메론빵 곰돌이 머그컵</span></div>
<div class="pd" style="max-width: 1200px; margin: 0 auto">

<div class="pd-gal" style="display: flex; flex-direction: column; gap: 12px; min-width: 0">
<img src="{{mainImg}}" alt="{{mainAlt}}" style="width: 100%; aspect-ratio: 620 / 573; object-fit: cover; border-radius: 20px; background: #F4EAD6; display: block">
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{gallery}}" as="g" hint-placeholder-count="6">
<button onClick="{{g.pick}}" aria-label="{{g.label}} 사진 보기" aria-pressed="{{g.on}}" style="{{g.style}}"><img src="{{g.img}}" alt="" aria-hidden="true" style="width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 10px"></button>
</sc-for>
</div>
</div>

<aside class="pd-buy" style="display: flex; flex-direction: column; gap: 20px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; color: #6B5232; font-weight: 500">melon mug · 세라믹 · 약 400ml</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #3B2410">메론빵 곰돌이 머그컵</h1>
<button onClick="{{goReview}}" style="align-self: flex-start; background: none; border: 0; padding: 4px 0; font-size: 14px; color: #5C4126"><b style="color: #C27A12">★ {{avgText}}</b> · 후기 {{reviewCount}}개 보기</button>
<span style="font-size: 28px; font-weight: 700; color: #5A3814">{{unitText}}</span>
</div>
<fieldset style="border: 0; padding: 0; margin: 0">
<legend style="font-weight: 700; font-size: 15px; margin-bottom: 10px">뚜껑</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{lids}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="{{m.style}}"><span style="font-weight: 700; font-size: 16px">{{m.label}}</span><span style="font-size: 13px; color: #6B5232">{{m.sub}}</span><span style="font-size: 15px; font-weight: 700; color: #4A6420">{{m.priceText}}</span></button>
</sc-for>
</div>
</fieldset>
<fieldset style="border: 0; padding: 0; margin: 0">
<legend style="font-weight: 700; font-size: 15px; margin-bottom: 10px">구성</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{sets}}" as="s" hint-placeholder-count="2">
<button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="{{s.style}}"><span style="font-weight: 700; font-size: 16px">{{s.label}}</span><span style="font-size: 13px; color: #6B5232">{{s.sub}}</span></button>
</sc-for>
</div>
</fieldset>
<a href="#d-pack" style="text-decoration: none; display: flex; align-items: center; gap: 12px; background: #F3F7EA; border-radius: 14px; padding: 10px 14px; color: #33461A">
<img src="images/pack-box.jpg" alt="" aria-hidden="true" style="width: 52px; height: 52px; border-radius: 10px; object-fit: cover">
<span style="display: flex; flex-direction: column; gap: 2px; font-size: 14px"><b style="font-size: 15px">기프트 박스 기본 포장</b><span style="color: #4A6420">모든 주문 무료 · 포장 보기 →</span></span>
</a>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: #FBF1DE; border-radius: 18px; padding: 16px 18px">
<div style="display: flex; align-items: center; gap: 4px">
<button onClick="{{dec}}" aria-label="수량 줄이기" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #D9C29A; background: #fff; font-size: 22px; color: #5A3814">−</button>
<span style="min-width: 40px; text-align: center; font-size: 18px; font-weight: 700" aria-live="polite">{{qty}}</span>
<button onClick="{{inc}}" aria-label="수량 늘리기" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #D9C29A; background: #fff; font-size: 22px; color: #5A3814">+</button>
</div>
<div style="text-align: right"><div style="font-size: 13px; color: #6B5232">총 상품 금액</div><div style="font-size: 28px; font-weight: 700; color: #5A3814">{{lineText}}</div></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{addCart}}" style="height: 56px; border-radius: 14px; border: 2px solid #5E7B2C; background: #fff; color: #4A6420; font-size: 17px; font-weight: 700">장바구니</button>
<button onClick="{{buyNow}}" style="height: 56px; border-radius: 14px; border: 0; background: #5E7B2C; color: #fff; font-size: 17px; font-weight: 700">구매하기</button>
</div>
<div style="font-size: 14px; color: #5C4126; line-height: 1.8; border-top: 1px solid #EFE2C8; padding-top: 14px">
<div><b>결제</b> 계좌이체 (무통장입금 · 실시간 계좌이체)</div>
<div><b>배송</b> 결제 확인 후 1–3영업일 출고 · 5만원 이상 무료</div>
<div><b>포장</b> 기프트 박스 기본 포장 (추가 비용 없음)</div>
</div>
</aside>

<div class="pd-det" style="min-width: 0">
<nav aria-label="상세 정보 메뉴" style="position: sticky; top: 69px; z-index: 5; background: #fff; border-bottom: 1.5px solid #EFE2C8; display: flex; flex-wrap: wrap; margin-top: 40px">
<a href="#d-info" style="text-decoration: none; padding: 16px 14px; font-weight: 700; font-size: 15px; color: #3B2410">상품 특징</a>
<a href="#d-view" style="text-decoration: none; padding: 16px 14px; font-weight: 500; font-size: 15px; color: #6B5232">디테일 · 뷰</a>
<a href="#d-spec" style="text-decoration: none; padding: 16px 14px; font-weight: 500; font-size: 15px; color: #6B5232">크기 · 재질</a>
<a href="#d-use" style="text-decoration: none; padding: 16px 14px; font-weight: 500; font-size: 15px; color: #6B5232">구성품 · 사용법</a>
<a href="#d-pack" style="text-decoration: none; padding: 16px 14px; font-weight: 500; font-size: 15px; color: #6B5232">포장</a>
<a href="#d-review" style="text-decoration: none; padding: 16px 14px; font-weight: 500; font-size: 15px; color: #6B5232">리뷰 {{reviewCount}}</a>
</nav>

<div style="max-width: 720px; margin: 0 auto; padding: 56px 0 0; display: flex; flex-direction: column; gap: 88px">

<div id="d-info" style="display: flex; flex-direction: column; gap: 20px; text-align: center; align-items: center; scroll-margin-top: 130px">
<span style="font-size: 13px; letter-spacing: .2em; color: #6B5232; font-weight: 700">MELON BREAD BEAR MUG</span>
<h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 36px; line-height: 1.3; color: #5A3814">귀여움과 실용성을 모두 담은<br>나만의 홈카페 아이템</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.9; color: #5C4126; max-width: 560px">갓 구운 메론빵의 바삭한 격자무늬, 동글동글 이어 붙인 손잡이, 그리고 빼꼼 얼굴을 내민 곰돌이. 매일 손이 가는 머그 하나로 아침 커피가 조금 더 특별해져요.</p>
<img src="images/mug-lid.jpg" alt="곰돌이 뚜껑을 덮은 메론빵 머그컵" style="width: 100%; max-width: 620px; aspect-ratio: 620 / 573; object-fit: cover; border-radius: 16px; display: block; margin-top: 12px">
</div>

<div style="display: flex; flex-direction: column; gap: 44px">
<div style="text-align: center; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; letter-spacing: .2em; color: #4A6420; font-weight: 700">DESIGN POINT</span><h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 32px; color: #5A3814">작은 디테일까지 빵처럼</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
<img src="images/detail-pattern.jpg" alt="입체적인 메론빵 격자무늬 표면" style="flex: 0 0 260px; width: 260px; height: 240px; object-fit: cover; border-radius: 16px">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Jua', sans-serif; font-size: 18px; color: #4A6420">01</span><h3 style="margin: 0; font-size: 22px">입체적인 메론빵 격자무늬</h3><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5C4126">메론빵 특유의 쿠키 껍질 결을 도톰하게 살려, 손끝으로 만져도 빵처럼 느껴지는 세라믹 질감이에요.</p></div>
</div>
<div style="display: flex; flex-wrap: wrap-reverse; gap: 28px; align-items: center">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Jua', sans-serif; font-size: 18px; color: #4A6420">02</span><h3 style="margin: 0; font-size: 22px">곰돌이 귀가 달린 뚜껑</h3><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5C4126">쏙 덮으면 음료가 오래 따뜻하고 먼지도 막아줘요. 귀를 손잡이 삼아 열고 닫기도 간편해요.</p></div>
<img src="images/detail-lid.jpg" alt="곰돌이 귀가 달린 뚜껑" style="flex: 0 0 260px; width: 260px; height: 240px; object-fit: cover; border-radius: 16px">
</div>
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
<img src="images/detail-handle.jpg" alt="동그란 빵 조각을 이어 붙인 손잡이" style="flex: 0 0 260px; width: 260px; height: 240px; object-fit: cover; border-radius: 16px">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Jua', sans-serif; font-size: 18px; color: #4A6420">03</span><h3 style="margin: 0; font-size: 22px">메론빵 모양 손잡이</h3><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5C4126">동그란 빵 조각을 이어 붙인 손잡이라 손가락이 자연스럽게 걸려 안정적으로 잡혀요.</p></div>
</div>
<div style="display: flex; flex-wrap: wrap-reverse; gap: 28px; align-items: center">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Jua', sans-serif; font-size: 18px; color: #4A6420">04</span><h3 style="margin: 0; font-size: 22px">사랑스러운 곰돌이 얼굴</h3><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5C4126">눈, 코, 입을 하나하나 올린 곰돌이 얼굴. 책상 위에 두기만 해도 기분이 좋아져요.</p></div>
<img src="images/detail-face.jpg" alt="곰돌이 얼굴 디테일" style="flex: 0 0 260px; width: 260px; height: 240px; object-fit: cover; border-radius: 16px">
</div>
</div>

<div id="d-view" style="display: flex; flex-direction: column; gap: 26px; scroll-margin-top: 130px">
<div style="text-align: center; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; letter-spacing: .2em; color: #4A6420; font-weight: 700">VIEW</span><h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 32px; color: #5A3814">어느 방향에서 봐도 귀여워요</h2></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; align-items: center"><img src="images/view-front.jpg" alt="정면" style="width: 100%; aspect-ratio: 620 / 573; object-fit: cover; border-radius: 14px"><figcaption style="font-size: 14px; color: #5C4126">정면</figcaption></figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; align-items: center"><img src="images/view-side.jpg" alt="측면" style="width: 100%; aspect-ratio: 620 / 573; object-fit: cover; border-radius: 14px"><figcaption style="font-size: 14px; color: #5C4126">측면</figcaption></figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; align-items: center"><img src="images/view-back.jpg" alt="후면" style="width: 100%; aspect-ratio: 620 / 573; object-fit: cover; border-radius: 14px"><figcaption style="font-size: 14px; color: #5C4126">후면</figcaption></figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; align-items: center"><img src="images/view-open.jpg" alt="뚜껑을 분리한 모습" style="width: 100%; aspect-ratio: 620 / 573; object-fit: cover; border-radius: 14px"><figcaption style="font-size: 14px; color: #5C4126">뚜껑 분리 시 모습</figcaption></figure>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; margin-top: 20px">
<h3 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 26px; color: #5A3814">뚜껑 없이도 충분히 예뻐요</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5C4126">뚜껑 없음 옵션은 가볍게 매일 쓰기 좋아요. 컵에도 곰돌이 얼굴이 그대로 있어요.</p>
<img src="images/mug-nolid.jpg" alt="뚜껑 없이 쓰는 메론빵 머그컵" style="width: 100%; max-width: 620px; aspect-ratio: 620 / 573; object-fit: cover; border-radius: 16px; display: block">
</div>
</div>

<div id="d-spec" style="display: flex; flex-direction: column; gap: 26px; scroll-margin-top: 130px">
<div style="text-align: center; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; letter-spacing: .2em; color: #4A6420; font-weight: 700">SIZE · MATERIAL</span><h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 32px; color: #5A3814">크기 · 용량 · 재질</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: center">
<img src="images/size.jpg" alt="가로 약 11cm, 높이 약 9cm, 용량 약 400ml" style="flex: 0 1 320px; width: 320px; max-width: 100%; border-radius: 14px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; font-size: 15px">
<div style="display: grid; grid-template-columns: 90px 1fr; padding: 12px 0; border-bottom: 1px solid #F1E6D2"><span style="color: #6B5232">크기</span><b>가로 약 11cm × 높이 약 9cm</b></div>
<div style="display: grid; grid-template-columns: 90px 1fr; padding: 12px 0; border-bottom: 1px solid #F1E6D2"><span style="color: #6B5232">용량</span><b>약 400ml</b></div>
<div style="display: grid; grid-template-columns: 90px 1fr; padding: 12px 0; border-bottom: 1px solid #F1E6D2"><span style="color: #6B5232">재질</span><b>세라믹 (도자기)</b></div>
<div style="display: grid; grid-template-columns: 90px 1fr; padding: 12px 0; border-bottom: 1px solid #F1E6D2"><span style="color: #6B5232">컬러</span><b>메론빵 그린 (몸체 · 뚜껑) / 연두 (손잡이)</b></div>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #6B5232; text-align: center">수작업 공정 특성상 크기와 색감에 약간의 차이가 있을 수 있어요.</p>
</div>

<div id="d-use" style="display: flex; flex-direction: column; gap: 26px; scroll-margin-top: 130px">
<div style="text-align: center; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; letter-spacing: .2em; color: #4A6420; font-weight: 700">COMPONENTS · HOW TO USE</span><h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 32px; color: #5A3814">구성품 · 사용 방법</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div style="background: #FBF6EC; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">머그 본체 1개</b><span style="font-size: 14px; color: #5C4126">모든 옵션 기본 포함</span></div>
<div style="background: #FBF6EC; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">곰돌이 뚜껑 1개</b><span style="font-size: 14px; color: #5C4126">'뚜껑 있음' 옵션 선택 시</span></div>
<div style="background: #FBF6EC; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px"><b style="font-size: 16px">기프트 박스 · 리본 태그</b><span style="font-size: 14px; color: #5C4126">모든 주문 기본 포함</span></div>
</div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
<li style="display: flex; gap: 14px; align-items: flex-start"><span style="flex: 0 0 32px; height: 32px; border-radius: 50%; background: #5E7B2C; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700">1</span><span style="font-size: 15px; line-height: 1.7"><b>첫 사용 전</b> 미지근한 물과 중성세제로 한 번 세척해 주세요.</span></li>
<li style="display: flex; gap: 14px; align-items: flex-start"><span style="flex: 0 0 32px; height: 32px; border-radius: 50%; background: #5E7B2C; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700">2</span><span style="font-size: 15px; line-height: 1.7"><b>음료 담기</b> 커피, 차, 우유 모두 OK. 따뜻한 음료는 뚜껑을 덮으면 더 오래 따뜻해요.</span></li>
<li style="display: flex; gap: 14px; align-items: flex-start"><span style="flex: 0 0 32px; height: 32px; border-radius: 50%; background: #5E7B2C; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700">3</span><span style="font-size: 15px; line-height: 1.7"><b>세척</b> 격자무늬 틈은 부드러운 스펀지로 닦아 주세요. 거친 수세미는 유약을 상하게 할 수 있어요.</span></li>
<li style="display: flex; gap: 14px; align-items: flex-start"><span style="flex: 0 0 32px; height: 32px; border-radius: 50%; background: #5E7B2C; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700">4</span><span style="font-size: 15px; line-height: 1.7"><b>주의</b> 급격한 온도 변화(냉동실 → 뜨거운 물)는 피해 주세요. 전자레인지 · 식기세척기: [사용 가능 여부]</span></li>
</ol>
</div>

<div id="d-pack" style="display: flex; flex-direction: column; gap: 22px; scroll-margin-top: 130px">
<div style="text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center">
<span style="font-size: 13px; letter-spacing: .2em; color: #4A6420; font-weight: 700">PACKAGE</span>
<h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 32px; color: #5A3814">모든 주문은 기프트 박스에 담아 보내드려요</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5C4126; max-width: 560px">따로 선물 포장을 고르지 않아도 돼요. 받는 순간부터 기분 좋도록, 체크 패턴 박스와 리본 태그로 정성껏 포장해 드려요.</p>
</div>
